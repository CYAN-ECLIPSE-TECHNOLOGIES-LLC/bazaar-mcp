name: Publish to PyPI

# Gate S5: releases build ONLY here, from a tagged commit, and publish
# via Trusted Publishing (OIDC) — no long-lived PyPI tokens anywhere,
# no laptop uploads. PEP 740 attestations are generated by the publish
# action. Gate A3: the same run re-publishes server.json to the
# Official MCP Registry, so the Registry version and the PyPI version
# can never drift apart.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The stamped package data (VERSION, bundled catalog, verdict
      # snapshot, corpus) is COMMITTED — regenerated in release prep by
      # tools/sync_package_data.py, never in CI (a CI checkout has no
      # test-bench sibling to regenerate from). The suite below pins
      # the committed data: version drift, bundled-copy freshness, and
      # snapshot/catalog ref parity all fail the build on staleness.
      - name: Run the test suite
        run: python -m unittest discover -s tests

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: twine check
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eclipse-bazaar/
    permissions:
      id-token: write # OIDC for Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  registry:
    # Gate A3, same run: re-publish server.json to the Official MCP
    # Registry. Each registry publish needs the new unique version in
    # server.json (bumped before tagging) — if this job fails on a
    # duplicate version, the release checklist was skipped; fix forward.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the Official MCP Registry
        run: ./mcp-publisher publish
