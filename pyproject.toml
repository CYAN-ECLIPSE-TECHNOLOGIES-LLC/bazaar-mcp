[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipse-bazaar"
dynamic = ["version"]
description = "Eclipse Bazaar — Cyan Eclipse Technologies' catalog of tested MCP products: MCP server, CLI, and Python SDK in one distribution."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "marketplace", "catalog", "agent-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://eclipsebazaar.com"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/bazaar-mcp"
Vendor = "https://cetech.ai"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]

[project.scripts]
eclipse-bazaar = "eclipse_bazaar.mcp_server:main"
bazaar = "eclipse_bazaar.cli:main"

# Version is dynamic: server.json is the single source of truth;
# tools/sync_version.py stamps it into VERSION (gate A3 version law).
[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eclipse_bazaar = [
    "data/catalog.json",
    "data/verdict_snapshot.json",
    "data/corpus.jsonl",
    "data/corpus.manifest.json",
]
